<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Unrot — Android focus app that locks distracting apps behind a timer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset=".55" stop-color="#090F16"/><stop offset="1" stop-color="#05080D"/></linearGradient>
<linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#67C7EB"/><stop offset=".62" stop-color="#4F8DFF"/><stop offset="1" stop-color="#16263A"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16263A" stop-opacity=".20"/><stop offset="1" stop-color="#67C7EB" stop-opacity=".06"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#EEF6FF" stop-opacity="0"/><stop offset=".5" stop-color="#EEF6FF" stop-opacity=".35"/><stop offset="1" stop-color="#EEF6FF" stop-opacity="0"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67C7EB" stop-opacity="0"/><stop offset=".5" stop-color="#67C7EB" stop-opacity=".18"/><stop offset="1" stop-color="#67C7EB" stop-opacity="0"/></linearGradient>
<radialGradient id="bloom"><stop offset="0" stop-color="#67C7EB" stop-opacity=".18"/><stop offset="1" stop-color="#67C7EB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#16263A" stroke-opacity=".18"/></pattern>
<clipPath id="win"><rect width="400" height="320" rx="18"/></clipPath>
<clipPath id="prev"><rect x="22" y="58" width="356" height="104" rx="10"/></clipPath>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.s{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.arrow{animation:arrow 2.2s ease-in-out infinite}
@keyframes arrow{50%{transform:translateX(5px)}}
.orbs{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{opacity:.65}}
.shinex{animation:shinex var(--sd,4.6s) linear infinite}
@keyframes shinex{from{transform:translateX(0)}to{transform:translateX(520px)}}
.scany{animation:scany var(--sy,5.5s) ease-in-out infinite}
@keyframes scany{0%,100%{transform:translateY(0)}50%{transform:translateY(88px)}}
@media (prefers-reduced-motion:reduce){.pulse,.arrow,.orbs,.ring,.shinex,.scany{animation:none!important}}
</style>
</defs>
<g clip-path="url(#win)">
<rect width="400" height="320" fill="url(#bg)"/>
<rect width="400" height="320" fill="url(#grid)"/>
<ellipse cx="70" cy="250" rx="230" ry="160" fill="url(#bloom)"/>

<rect width="400" height="42" fill="url(#head)"/>
<text class="s" x="20" y="28" font-size="20" font-weight="800" fill="#080D13">Unrot</text>
<text class="m" x="382" y="27" text-anchor="end" font-size="9" fill="#EEF6FF" fill-opacity=".8">node 02 · android</text>
<rect class="shinex" style="--sd:5.2s" x="-120" y="0" width="120" height="42" fill="url(#shine)" opacity=".5"/>

<circle cx="5" cy="160" r="4.5" fill="#B97D10" filter="url(#glow)"/>
<circle cx="395" cy="160" r="4.5" fill="#B97D10" filter="url(#glow)"/>
<path d="M9 160h9M391 160h-9" stroke="#B97D10" stroke-width="1.5" opacity=".85"/>

<rect x="22" y="58" width="356" height="104" rx="10" fill="#080E15" stroke="#16263A" stroke-opacity=".7"/>
<g clip-path="url(#prev)">
<text class="m" x="40" y="82" font-size="9" letter-spacing="1.4" fill="#7E93A8">SAMPLE · LOCKED</text>
<text class="s" x="40" y="104" font-size="16" font-weight="700" fill="#EEF6FF">12 apps</text>
<rect x="40" y="116" width="64" height="3" rx="1.5" fill="#182434"/>
<rect x="40" y="116" width="46" height="3" rx="1.5" fill="#3B82F6"/>
<text class="m" x="360" y="82" text-anchor="end" font-size="9" letter-spacing="1.4" fill="#7E93A8">SAMPLE · EARNED</text>
<text class="s" x="360" y="104" text-anchor="end" font-size="16" font-weight="700" fill="#EEF6FF">25 min</text>
<rect x="296" y="116" width="64" height="3" rx="1.5" fill="#182434"/>
<rect x="314" y="116" width="46" height="3" rx="1.5" fill="#67C7EB"/>

<g transform="translate(200 112)">
<circle r="34" fill="#070C12" stroke="#182434" stroke-width="6"/>
<g class="ring"><circle r="34" fill="none" stroke="#67C7EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="149.5 213.6" transform="rotate(-90)"/></g>
<g class="orbs"><circle cx="34" cy="0" r="2.6" fill="#A9C7FF"/></g>
<text class="s" y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#EEF6FF">25:00</text>
<text class="m" y="19" text-anchor="middle" font-size="9" letter-spacing="1.6" fill="#67C7EB">FOCUS</text>
</g>

<g fill="none" stroke-width="1.6">
<path d="M104 140h20M104 146h12" stroke="#16263A" stroke-opacity=".7"/>
<path d="M276 140h20M284 146h12" stroke="#16263A" stroke-opacity=".7"/>
</g>
<rect class="scany" style="--sy:6.5s" x="0" y="58" width="400" height="16" fill="url(#scan)"/>
</g>

<text class="s" x="22" y="190" font-size="15" fill="#B9C7D6">Locks distracting apps behind a focus timer;</text>
<text class="s" x="22" y="211" font-size="15" fill="#B9C7D6">earn time back with math challenges.</text>

<g class="s" font-size="12.5" fill="#EEF6FF">
<rect x="22" y="230" width="72" height="26" rx="13" fill="#67C7EB" fill-opacity=".10" stroke="#67C7EB" stroke-opacity=".65"/>
<text x="58" y="247" text-anchor="middle">Android</text>
<rect x="102" y="230" width="65" height="26" rx="13" fill="#67C7EB" fill-opacity=".10" stroke="#67C7EB" stroke-opacity=".65"/>
<text x="134.5" y="247" text-anchor="middle">Kotlin</text>
<rect x="175" y="230" width="119" height="26" rx="13" fill="#67C7EB" fill-opacity=".10" stroke="#67C7EB" stroke-opacity=".65"/>
<text x="234.5" y="247" text-anchor="middle">Product Design</text>
</g>

<rect x="22" y="270" width="356" height="34" rx="17" fill="#67C7EB" fill-opacity=".12" stroke="#67C7EB" stroke-opacity=".55"/>
<rect x="22" y="270" width="34" height="34" rx="17" fill="#67C7EB" fill-opacity=".18"/>
<rect x="34" y="282" width="10" height="8" rx="2" fill="none" stroke="#67C7EB" stroke-width="1.5"/>
<path d="M37 282v-3a2 2 0 0 1 4 0v3" fill="none" stroke="#67C7EB" stroke-width="1.5"/>
<text class="s" x="68" y="292" font-size="13" font-weight="700" letter-spacing=".6" fill="#67C7EB">open repository</text>
<g class="arrow"><path d="M346 287h12M352 282l5 5-5 5" fill="none" stroke="#67C7EB" stroke-width="1.8" stroke-linecap="round"/></g>
</g>
<rect x=".5" y=".5" width="399" height="319" rx="18" fill="none" stroke="#16263A" stroke-opacity=".45"/>
</svg>
