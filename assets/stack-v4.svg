.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.marq1{animation:marq1 28s linear infinite}
@keyframes marq1{from{transform:translateX(0)}to{transform:translateX(-685px)}}
.marq2{animation:marq2 34s linear infinite}
