.play{animation:play 12s linear infinite}
@keyframes play{0%,100%{transform:translateX(0)}50%{transform:translateX(1120px)}}
@media (prefers-reduced-motion:reduce){.pulse,.marq1,.marq2,.play{animation:none!important}}
</style>
